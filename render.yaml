# Render Blueprint for the unified GovCareer + Campus Portal.
# Uses the same PostgreSQL + Prisma schema/migrations as the P1 portal (campus/backend/prisma).
services:
  - type: web
    name: govcareer-unified
    runtime: node
    # Root directory: leave empty (repo root contains package.json).
    buildCommand: npm install && npx prisma generate --schema=campus/backend/prisma/schema.prisma
    # The Campus child process runs `prisma migrate deploy` automatically on boot (AUTO_MIGRATE).
    startCommand: npm start
    healthCheckPath: /api/health
    # Hybrid RAG snapshot + embedding cache survive restarts/deploys only on a persistent disk (requires a paid Render plan).
    disk:
      name: govcareer-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORTAL_SECRETS_ENCRYPTION_KEY
        generateValue: true
      - key: AI_ML_SERVICE_TOKEN
        generateValue: true
      - key: OPERATIONS_TOKEN
        generateValue: true
      - key: BRIDGE_SERVICE_SECRET
        generateValue: true
      - key: PORTAL_ADMIN_EMAIL
        sync: false
      - key: PORTAL_ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ML_AUTOINSTALL
        value: "false"
      - key: HYBRID_RAG_SYNC_MINUTES
        value: "30"
      - key: HYBRID_RAG_RECORDS_PATH
        value: /data/hybrid_rag/records.json
